<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk to Tally's CV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2340;
    --navy-mid: #2d3a5e;
    --accent: #e8764a;
    --accent-light: #fdf0ea;
    --text: #1a2340;
    --text-mid: #5a6480;
    --text-light: #9aa0b5;
    --surface: #ffffff;
    --surface-2: #f7f8fc;
    --border: rgba(26,35,64,0.10);
    --bubble-user: #1a2340;
    --bubble-tally: #f7f8fc;
    --radius: 18px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--surface-2);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  .app {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--border), 0 4px 32px rgba(26,35,64,0.06);
  }

  /* HEADER */
  .header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar-wrap img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .status-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 12px;
    height: 12px;
    background: #3ec97e;
    border-radius: 50%;
    border: 2px solid var(--surface);
  }

  .header-info h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--navy);
    line-height: 1.2;
  }

  .header-info p {
    font-size: 13px;
    color: var(--text-mid);
    margin-top: 2px;
    font-weight: 300;
  }

  .header-badge {
    margin-left: auto;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    border: 1px solid rgba(232,118,74,0.2);
    flex-shrink: 0;
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 100px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 88%;
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message.tally {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .msg-avatar.user-av {
    background: var(--navy-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }

  .bubble {
    padding: 13px 17px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    position: relative;
  }

  .message.tally .bubble {
    background: var(--bubble-tally);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .bubble {
    background: var(--bubble-user);
    color: rgba(255,255,255,0.93);
    border-top-right-radius: 4px;
  }

  .bubble p { margin-bottom: 0.6em; }
  .bubble p:last-child { margin-bottom: 0; }

  .bubble ul, .bubble ol {
    margin: 0.4em 0 0.6em 1.4em;
  }

  .bubble li { margin-bottom: 0.3em; }

  .bubble strong {
    font-weight: 500;
    color: var(--navy);
  }

  .message.user .bubble strong {
    color: rgba(255,255,255,1);
  }

  /* INPUT */
  .input-area {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    bottom: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 10px 10px 18px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(26,35,64,0.3);
  }

  textarea {
    flex: 1;
    border: none;
    background: transparent;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    outline: none;
    max-height: 140px;
    min-height: 24px;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-light); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--navy);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    color: white;
  }

  .send-btn:hover { background: var(--navy-mid); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { background: var(--border); cursor: default; transform: none; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .input-footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
  }

  /* TYPING */
  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 14px 17px;
    background: var(--bubble-tally);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-top-left-radius: 4px;
    width: fit-content;
    align-items: center;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--text-light);
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .messages { padding: 20px 16px; }
    .input-area { padding: 12px 14px 16px; }
    .header { padding: 16px 18px 14px; }
    .header-badge { display: none; }
  }
</style>
</head>

function formatMessage(text) {
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  const lines = text.split('\n');
  let html = '';

  for (let line of lines) {
    const trimmed = line.trim();

}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function callClaude(userMessage) {
  conversationHistory.push({ role: 'user', content: userMessage });
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: conversationHistory })
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(`API error ${response.status}: ${JSON.stringify(data)}`);
  }
  const reply = data.content[0].text;
  conversationHistory.push({ role: 'assistant', content: reply });
  return reply;
}

function scrollToMessage(el) {
  if (!el) return;
  const msgs = document.getElementById('messages');
  let top = 0;
  let node = el;
  while (node && node !== msgs) {
    top += node.offsetTop;
    node = node.offsetParent;
  }
  msgs.scrollTop = top - 16;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const userMsg = addMessage('user', text);
  scrollToMessage(userMsg);
  showTyping();

  try {
    const reply = await callClaude(text);
    removeTyping();
    addMessage('tally', reply);
  } catch (err) {
    removeTyping();
    addMessage('tally', "Oops — something went wrong on my end. Please try again in a moment!");
    console.error(err);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}


function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

window.addEventListener('load', async () => {
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  const typing = showTyping();

  try {
    const reply = await callClaude("Hello, I just opened this CV bot. Please greet me and ask what I already know about Tally and what I'd like to explore.");
    removeTyping();
    const greeting = addMessage('tally', reply);
    scrollToMessage(greeting);
  } catch (err) {
    removeTyping();
    addMessage('tally', "Hi there! I'm Tally's CV bot — happy to walk you through my professional journey. What would you like to know about my experience and background?");
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
});
</script>
